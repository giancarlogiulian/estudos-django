<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Estudos Django{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f7f5;
            --ink: #1a2e24;
            --accent: #2d6a4f;
            --muted: #52796f;
            --card: #ffffff;
            --line: #d8e2dc;
            --warn: #bc4749;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(circle at top left, #d8f3dc 0%, transparent 40%),
                var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
        }

        .brand {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        nav a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover { color: var(--accent); }

        .badge {
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            padding: 0.1rem 0.45rem;
            font-size: 0.75rem;
            margin-left: 0.25rem;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        h1 { margin-top: 0; }

        .lead {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1.25rem;
        }

        .messages li {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #d8f3dc;
            border: 1px solid var(--line);
        }

        .messages li.error { background: #f8d7da; }
        .messages li.warning { background: #fff3cd; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .card, .post {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }

        .card h2, .post h2 {
            margin: 0 0 0.5rem;
            font-size: 1.15rem;
        }

        .card h2 a, .post h2 a {
            color: var(--ink);
            text-decoration: none;
        }

        .card h2 a:hover, .post h2 a:hover { color: var(--accent); }

        .meta, .preco {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .preco {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .empty {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 12px;
        }

        .back {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-decoration: none;
        }

        .conteudo {
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin: 2rem 0 1rem;
        }

        .section-title a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn:hover { filter: brightness(1.05); }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-danger {
            background: var(--warn);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .chips a {
            text-decoration: none;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.3rem 0.75rem;
            background: var(--card);
            font-size: 0.875rem;
        }

        .chips a.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        th, td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th { background: #eef5f0; }

        form.stack p { margin-bottom: 1rem; }

        form.stack label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        form.stack input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{% url 'home' %}">Estudos Django</a>
        <nav>
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'loja:lista' %}">Loja</a>
            <a href="{% url 'blog:home' %}">Blog</a>
            <a href="{% url 'chatbot:chat' %}">ChatBot</a>
            <a href="{% url 'loja:carrinho' %}">
                Carrinho{% if carrinho_qtd %}<span class="badge">{{ carrinho_qtd }}</span>{% endif %}
            </a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
