{% extends "base.html" %}

{% block title %}{{ post.titulo }} | Estudos Django{% endblock %}

{% block content %}
<a class="back" href="{% url 'blog:home' %}">&larr; Voltar</a>
<article class="post">
    <h1>{{ post.titulo }}</h1>
    <p class="meta">{{ post.criado_em|date:"d/m/Y H:i" }}</p>
    <div class="conteudo">{{ post.conteudo }}</div>
</article>
{% endblock %}
